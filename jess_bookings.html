<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookings - Energy with Jess</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Belleza&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal:     #3B5E6E;
      --teal-mid: #2d4a57;
      --pink:     #bf4288;
      --dark:     #1E2E32;
      --cream:    #FAF7F2;
      --lavender: #C4B0D4;
      --border:   #E4EAEC;
      --teal-bg:  rgba(59,94,110,0.08);
      --pink-bg:  rgba(191,66,136,0.08);
      --lav-bg:   rgba(196,176,212,0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Belleza', sans-serif;
      background: var(--cream);
      color: var(--dark);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .header {
      background: var(--dark);
      color: var(--cream);
      padding: 10px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      opacity: 0.55;
      text-transform: uppercase;
    }
    .header-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: 0.06em;
    }
    .header-right { width: 120px; text-align: right; }

    /* ── TOOLBAR ── */
    .toolbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 9px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .btn {
      font-family: 'Belleza', sans-serif;
      font-size: 0.82rem;
      border-radius: 5px;
      padding: 6px 13px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }
    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      color: var(--dark);
    }
    .btn-ghost:hover { background: var(--teal-bg); }
    .btn-teal {
      background: var(--teal);
      border: 1px solid var(--teal);
      color: #fff;
    }
    .btn-teal:hover { background: var(--teal-mid); }
    .nav-arrow {
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 11px;
      font-size: 1rem;
      cursor: pointer;
      color: var(--dark);
      line-height: 1;
    }
    .nav-arrow:hover { background: var(--teal-bg); }
    .toolbar-date {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      font-weight: 500;
      min-width: 220px;
    }
    .spacer { flex: 1; }
    .view-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 5px;
      overflow: hidden;
    }
    .btn-view {
      background: none;
      border: none;
      padding: 6px 15px;
      cursor: pointer;
      font-family: 'Belleza', sans-serif;
      font-size: 0.82rem;
      color: var(--dark);
      transition: background 0.15s, color 0.15s;
    }
    .btn-view.active { background: var(--teal); color: #fff; }
    .btn-view:not(.active):hover { background: var(--teal-bg); }

    /* ── LEGEND ── */
    .legend {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      color: #666;
    }
    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── MAIN ── */
    .main {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .calendar-area {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* ── LOADING / ERROR ── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 180px;
      gap: 10px;
      color: var(--teal);
      font-size: 0.85rem;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box {
      margin: 24px;
      padding: 16px 20px;
      background: #fff9ec;
      border: 1px solid #f0c040;
      border-radius: 8px;
      font-size: 0.84rem;
      color: #7a5c00;
      line-height: 1.6;
    }
    .error-box strong { display: block; margin-bottom: 4px; }

    /* ── WEEK VIEW ── */
    .week-header {
      display: grid;
      grid-template-columns: 50px repeat(7, 1fr);
      background: #fff;
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .wh-spacer { border-right: 1px solid var(--border); }
    .wh-day {
      padding: 7px 4px;
      text-align: center;
      border-right: 1px solid var(--border);
    }
    .wh-day-name {
      font-size: 0.65rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .wh-day-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1.3;
    }
    .wh-day.today .wh-day-num {
      background: var(--teal);
      color: #fff;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    .week-body {
      display: grid;
      grid-template-columns: 50px repeat(7, 1fr);
    }
    .time-gutter { border-right: 1px solid var(--border); }
    .time-slot {
      height: 72px;
      padding: 3px 5px 0 0;
      text-align: right;
      font-size: 0.67rem;
      color: #bbb;
      position: relative;
      top: -7px;
    }
    .day-col {
      border-right: 1px solid var(--border);
      position: relative;
    }
    .day-col.today-bg { background: rgba(59,94,110,0.025); }
    .day-inner {
      position: relative;
      height: 1008px; /* 14hrs * 72px */
    }
    .hour-line {
      position: absolute;
      left: 0;
      right: 0;
      border-bottom: 1px solid #eee;
    }
    .half-line {
      position: absolute;
      left: 0;
      right: 0;
      border-bottom: 1px dashed rgba(0,0,0,0.05);
    }
    .week-event {
      position: absolute;
      left: 2px;
      right: 2px;
      border-radius: 4px;
      padding: 3px 5px;
      font-size: 0.7rem;
      line-height: 1.35;
      cursor: pointer;
      overflow: hidden;
      z-index: 2;
      transition: opacity 0.12s, transform 0.12s;
    }
    .week-event:hover { opacity: 0.82; transform: scale(1.01); }
    .ev-svc {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ev-who {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.88;
    }
    .ev-t { opacity: 0.72; }

    /* ── MONTH VIEW ── */
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-top: 1px solid var(--border);
      border-left: 1px solid var(--border);
    }
    .mg-head {
      background: #fff;
      padding: 7px 4px;
      text-align: center;
      font-size: 0.65rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .mg-cell {
      min-height: 105px;
      padding: 4px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .mg-cell.other-m { background: #f8f8f8; }
    .mg-cell.today-m { background: rgba(59,94,110,0.03); }
    .mg-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 1px 4px;
      display: inline-block;
      min-width: 20px;
      text-align: center;
      border-radius: 50%;
    }
    .mg-cell.today-m .mg-num { background: var(--teal); color: #fff; }
    .mg-cell.other-m .mg-num { color: #ccc; }
    .month-event {
      display: block;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 0.67rem;
      margin-top: 2px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 0.12s;
    }
    .month-event:hover { opacity: 0.78; }

    /* ── EVENT COLOUR CLASSES ── */
    .ev-massage   { background: #bf4288; color: #fff; }
    .ev-reiki     { background: #3B5E6E; color: #fff; }
    .ev-reading   { background: #C4B0D4; color: #1E2E32; }
    .ev-mentoring { background: #f2c14e; color: #1E2E32; }
    .ev-phone     { background: #4e8c82; color: #fff; }
    .ev-market    { background: #5a6478; color: #fff; }
    .ev-cash-badge { font-size: 0.65rem; font-weight: 700; opacity: 0.85; margin-left: 2px; }
    .btn-market { background: #5a6478; color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.82rem; cursor: pointer; white-space: nowrap; }
    .btn-market:hover { background: #4a5468; }
    /* Market modal */
    .market-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:900; align-items:center; justify-content:center; }
    .market-overlay.open { display:flex; }
    .market-modal { background:#fff; border-radius:12px; padding:28px 32px; width:360px; max-width:94vw; box-shadow:0 8px 40px rgba(0,0,0,0.18); }
    .market-modal h3 { margin:0 0 20px; font-size:1.1rem; color:#1E2E32; }
    .market-field { margin-bottom:14px; }
    .market-field label { display:block; font-size:0.78rem; color:#555; margin-bottom:4px; font-weight:600; }
    .market-field input { width:100%; box-sizing:border-box; border:1px solid #ddd; border-radius:6px; padding:8px 10px; font-size:0.9rem; }
    .market-field input:focus { outline:none; border-color:#5a6478; }
    .market-row { display:flex; gap:12px; }
    .market-row .market-field { flex:1; }
    .market-actions { display:flex; gap:10px; margin-top:20px; }
    .market-actions .btn-save { flex:1; background:#5a6478; color:#fff; border:none; border-radius:6px; padding:10px; font-size:0.9rem; cursor:pointer; }
    .market-actions .btn-save:hover { background:#4a5468; }
    .market-actions .btn-cancel-m { flex:1; background:#f0f0f0; color:#555; border:none; border-radius:6px; padding:10px; font-size:0.9rem; cursor:pointer; }
    .market-msg { font-size:0.8rem; margin-top:10px; text-align:center; min-height:18px; }
    .mkt-pills-wrap { margin-bottom:18px; }
    .mkt-pills-label { font-size:0.72rem; color:#888; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:7px; }
    .mkt-pill { display:inline-flex; align-items:center; gap:5px; background:#eef1f4; border:1px solid #d0d5dd; border-radius:20px; padding:5px 11px; font-size:0.82rem; cursor:pointer; margin:0 5px 5px 0; color:#1E2E32; transition:background 0.15s; }
    .mkt-pill:hover { background:#dde2e8; }
    .mkt-pill-del { font-size:1rem; line-height:1; color:#999; cursor:pointer; }
    .mkt-pill-del:hover { color:#c00; }

    /* ── LAUNCH / COURSE CHIPS ── */
    .launch-chip {
      display: block;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 0.62rem;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-style: italic;
    }
    .lc-reiki  { background: rgba(196,176,212,0.3); color: #6b527e; border-left: 2px solid var(--lavender); }
    .lc-launch { background: rgba(196,176,212,0.3); color: #6b527e; border-left: 2px solid var(--lavender); }
    .lc-joy    { background: rgba(196,176,212,0.3); color: #6b527e; border-left: 2px solid var(--lavender); }
    .wh-launches { padding: 3px 0 0; }

    /* ── DETAIL PANEL ── */
    .detail-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 295px;
      height: 100vh;
      background: #fff;
      border-left: 1px solid var(--border);
      box-shadow: -6px 0 24px rgba(0,0,0,0.07);
      overflow-y: auto;
      transform: translateX(295px);
      transition: transform 0.22s ease;
      z-index: 200;
    }
    .detail-panel.open { transform: translateX(0); }
    .dp-inner { padding: 18px 18px 30px; position: relative; }
    .dp-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      font-size: 1.15rem;
      color: #aaa;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .dp-close:hover { color: var(--dark); }
    .dp-service {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-weight: 500;
      padding-right: 26px;
      margin-bottom: 3px;
    }
    .dp-datetime {
      font-size: 0.79rem;
      color: #777;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .dp-divider { height: 1px; background: var(--border); margin: 12px 0; }
    .dp-label {
      font-size: 0.67rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    .dp-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 10px;
    }
    .dp-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .dp-ico { color: var(--teal); flex-shrink: 0; width: 16px; font-size: 0.75rem; }
    .dp-link { color: var(--teal); text-decoration: none; }
    .dp-link:hover { text-decoration: underline; }
    .dp-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge-cash  { background: #fef3d0; color: #8a6000; }
    .badge-online { background: var(--teal-bg); color: var(--teal); }
    .dp-notes {
      font-size: 0.8rem;
      color: #555;
      line-height: 1.55;
      background: var(--cream);
      border-radius: 5px;
      padding: 8px 10px;
      margin-top: 4px;
    }
    .dp-actions {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-action {
      font-family: 'Belleza', sans-serif;
      font-size: 0.82rem;
      border-radius: 5px;
      padding: 8px 14px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, color 0.15s;
      width: 100%;
    }
    .btn-reschedule {
      background: var(--teal-bg);
      border: 1px solid var(--teal);
      color: var(--teal);
    }
    .btn-reschedule:hover { background: var(--teal); color: #fff; }
    .btn-cancel-bk {
      background: none;
      border: 1px solid #ddb0b0;
      color: #b94040;
    }
    .btn-cancel-bk:hover { background: #fdf0f0; }
    .btn-confirm-cancel {
      background: #b94040;
      border: 1px solid #b94040;
      color: #fff;
    }
    .btn-confirm-cancel:hover { background: #963333; }
    .btn-back {
      background: none;
      border: 1px solid var(--border);
      color: #888;
    }
    .btn-back:hover { background: #f5f5f5; }
    .dp-confirm-box {
      background: #fdf0f0;
      border: 1px solid #ddb0b0;
      border-radius: 6px;
      padding: 12px;
      font-size: 0.82rem;
      color: #7a2020;
      margin-top: 14px;
      line-height: 1.5;
    }
    .dp-confirm-box strong { display: block; margin-bottom: 6px; }
    .reschedule-form {
      margin-top: 14px;
      background: var(--cream);
      border-radius: 6px;
      padding: 12px;
    }
    .reschedule-form label {
      display: block;
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 4px;
      margin-top: 10px;
    }
    .reschedule-form label:first-child { margin-top: 0; }
    .reschedule-form input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: 'Belleza', sans-serif;
      font-size: 0.84rem;
      background: #fff;
      color: var(--dark);
    }
    .reschedule-form input:focus {
      outline: none;
      border-color: var(--teal);
    }
    .btn-confirm-reschedule {
      background: var(--teal);
      border: 1px solid var(--teal);
      color: #fff;
      margin-top: 12px;
    }
    .btn-confirm-reschedule:hover { background: var(--teal-mid); }
    .dp-processing {
      font-size: 0.8rem;
      color: var(--teal);
      text-align: center;
      padding: 8px 0;
    }
  </style>
</head>
<body>

<div class="header">
  <span class="header-brand">Energy with Jess</span>
  <span class="header-title">Bookings</span>
  <div class="header-right"></div>
</div>

<div class="toolbar">
  <button class="nav-arrow" onclick="navigate(-1)">&#8249;</button>
  <button class="btn btn-teal" onclick="goToday()">Today</button>
  <button class="nav-arrow" onclick="navigate(1)">&#8250;</button>
  <div class="toolbar-date" id="toolbar-date"></div>
  <div class="spacer"></div>
  <button class="btn btn-ghost" onclick="refreshAll()" title="Reload bookings from Google Calendar" style="font-size:0.82rem;">&#8635; Refresh</button>
  <button class="btn btn-market" onclick="openMarketModal()">+ Market</button>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#bf4288"></div>Massage</div>
    <div class="legend-item"><div class="legend-dot" style="background:#3B5E6E"></div>Reiki/Healing</div>
    <div class="legend-item"><div class="legend-dot" style="background:#C4B0D4"></div>Readings</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f2c14e"></div>Mentoring</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4e8c82"></div>Other</div>
    <div class="legend-item"><div class="legend-dot" style="background:#5a6478"></div>Market</div>
  </div>
  <div class="view-toggle">
    <button class="btn-view active" id="btn-week" onclick="setView('week')">Week</button>
    <button class="btn-view"        id="btn-month" onclick="setView('month')">Month</button>
  </div>
</div>

<div class="main">
  <div class="calendar-area" id="calendar-area">
    <div class="loading"><div class="spinner"></div> Loading bookings&hellip;</div>
  </div>
</div>

<div class="detail-panel" id="detail-panel">
  <div class="dp-inner" id="dp-content">
    <button class="dp-close" onclick="closeDetail()">&#215;</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────
//  CONFIG - your Apps Script deployment URL
// ─────────────────────────────────────────
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz5gc-NWWOFlyJrXXE1BcgG4PiKiAc-kaDh1k6YJHKNcuzwrQlNsVFj-ub4nctEK-1S/exec';

// ─────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────
let currentDate  = new Date();
let viewMode     = 'week';
let allBookings  = [];
let fetchedKeys  = new Set();

// ── LAUNCH / COURSE EVENTS ──
const LAUNCH_EVENTS = [
  { id:'l-r1-jun',    title:'Reiki 1 - June',          start:'2026-06-06', end:'2026-06-08', color:'reiki'  },
  { id:'l-r2-jun-d1', title:'Reiki 2 - June (Day 1)',   start:'2026-06-14', end:'2026-06-15', color:'reiki'  },
  { id:'l-r2-jun-d2', title:'Reiki 2 - June (Day 2)',   start:'2026-06-21', end:'2026-06-22', color:'reiki'  },
  { id:'l-unbecoming',title:'🚀 The Unbecoming',         start:'2026-07-20', end:'2026-07-21', color:'launch' },
  { id:'l-joy-aug',   title:'7 Days of Joy',             start:'2026-08-17', end:'2026-08-24', color:'joy'    },
  { id:'l-ee',        title:'🚀 Empowered Empath',       start:'2026-08-17', end:'2026-08-18', color:'launch' },
  { id:'l-r1-sep',    title:'Reiki 1 - September',       start:'2026-09-19', end:'2026-09-21', color:'reiki'  },
  { id:'l-r2-oct-d1', title:'Reiki 2 - Oct (Day 1)',     start:'2026-10-04', end:'2026-10-05', color:'reiki'  },

  { id:'l-pyr',       title:'Plan Your Year 2027',       start:'2026-11-01', end:'2026-11-02', color:'launch' },

function launchesForDay(date) {
  // Build a local YYYY-MM-DD string to avoid UTC-offset mismatches
  const d = date.getFullYear() + '-' +
            String(date.getMonth() + 1).padStart(2, '0') + '-' +
            String(date.getDate()).padStart(2, '0');
  return LAUNCH_EVENTS.filter(l => d >= l.start && d < l.end);
}

function navigate(dir) {
  if (viewMode === 'week') {
    currentDate = new Date(currentDate.getTime() + dir * 7 * 86400000);
  } else {
    currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + dir, 1);
  }
  updateToolbarDate();
  fetchAndRender();
}

function goToday() {
  currentDate = new Date();
  updateToolbarDate();
  fetchAndRender();
}

function setView(v) {
  viewMode = v;
  document.getElementById('btn-week').classList.toggle('active', v === 'week');
  document.getElementById('btn-month').classList.toggle('active', v === 'month');
  updateToolbarDate();
  fetchAndRender();
}

function updateToolbarDate() {
  const el = document.getElementById('toolbar-date');
  if (viewMode === 'week') {
    const ws = weekStart(currentDate);
    const we = new Date(ws.getTime() + 6 * 86400000);
    const lo = { day: 'numeric', month: 'short' };
    const hi = { day: 'numeric', month: 'short', year: 'numeric' };
    if (ws.getMonth() === we.getMonth())
      el.textContent = ws.getDate() + ' - ' + we.toLocaleDateString('en-AU', hi);
    else
      el.textContent = ws.toLocaleDateString('en-AU', lo) + ' - ' + we.toLocaleDateString('en-AU', hi);
  } else {
    el.textContent = currentDate.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });
  }
}

// ─────────────────────────────────────────
//  DATA FETCHING
// ─────────────────────────────────────────
async function fetchAndRender() {
  const { start, end } = currentRange();
  const key = start.toDateString() + '|' + end.toDateString();

  if (fetchedKeys.has(key)) {
    renderCalendar();
    return;
  }

  document.getElementById('calendar-area').innerHTML =
    '<div class="loading"><div class="spinner"></div> Loading bookings&hellip;</div>';

  try {
    const url = APPS_SCRIPT_URL
      + '?action=bookings'
      + '&start=' + encodeURIComponent(start.toISOString())
      + '&end='   + encodeURIComponent(end.toISOString());

    const res  = await fetch(url);
    const data = await res.json();

    if (!data.success) {
      showError('Apps Script returned an error: ' + (data.error || 'Unknown'));
      return;
    }

    const existingIds = new Set(allBookings.map(b => b.id));
    data.bookings.forEach(b => { if (!existingIds.has(b.id)) allBookings.push(b); });
    fetchedKeys.add(key);

  } catch (err) {

    showError(
      'Could not reach your booking system.\n\n' +
      'Make sure the Apps Script is deployed with "Execute as: Me" and "Access: Anyone".\n\n' +
      'Error: ' + err.toString()
    );
    return;
  }

  renderCalendar();
}

function refreshAll() {
  allBookings = [];
  fetchedKeys.clear();
  fetchAndRender();
}

function currentRange() {
  if (viewMode === 'week') {
    const s = weekStart(currentDate);
    const e = new Date(s.getTime() + 7 * 86400000);
    return { start: s, end: e };
  } else {
    const s = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
    const e = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
    return { start: s, end: e };
  }
}

  else renderMonth();

// ─────────────────────────────────────────
//  WEEK VIEW
// ─────────────────────────────────────────
function renderWeek() {
  const START_H    = 7;
  const END_H      = 21;
  const HR_PX      = 72;
  const TOTAL_H    = (END_H - START_H) * HR_PX;
  const DAYS       = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  const ws    = weekStart(currentDate);
  const today = midnight(new Date());
  const days  = Array.from({length: 7}, (_, i) => new Date(ws.getTime() + i * 86400000));

  // Header
  let h = '<div class="week-header"><div class="wh-spacer"></div>';
  days.forEach((d, i) => {
    const isTd = midnight(d).getTime() === today.getTime();
    const wkL  = launchesForDay(d);
    h += `<div class="wh-day${isTd ? ' today' : ''}">
      <div class="wh-day-name">${DAYS[i]}</div>
      <div class="wh-day-num">${d.getDate()}</div>
      ${wkL.length ? '<div class="wh-launches">' + wkL.map(l => `<div class="launch-chip lc-${l.color}" title="${esc(l.title)}">${esc(l.title)}</div>`).join('') + '</div>' : ''}
    </div>`;
  });
  h += '</div>';

  // Body
  h += '<div class="week-body"><div class="time-gutter">';
  for (let hr = START_H; hr < END_H; hr++) {
    const lbl = hr === 12 ? '12pm' : hr < 12 ? hr + 'am' : (hr - 12) + 'pm';
    h += `<div class="time-slot">${lbl}</div>`;
  }
  h += '</div>';

  days.forEach(d => {
    const isTd = midnight(d).getTime() === today.getTime();
    const bks  = bookingsForDay(d);

    h += `<div class="day-col${isTd ? ' today-bg' : ''}"><div class="day-inner">`;

    // Grid lines
    for (let hr = START_H; hr < END_H; hr++) {
      const top = (hr - START_H) * HR_PX;
      h += `<div class="hour-line" style="top:${top}px;"></div>`;
      h += `<div class="half-line" style="top:${top + HR_PX / 2}px;"></div>`;
    }

    // Events
    bks.forEach(b => {
      const s  = new Date(b.start);
      const e  = new Date(b.end);
      const sh = s.getHours() + s.getMinutes() / 60;
      const eh = e.getHours() + e.getMinutes() / 60;
      const cs = Math.max(sh, START_H);
      const ce = Math.min(eh, END_H);
      if (ce <= cs) return;

      const top = (cs - START_H) * HR_PX;
      const ht  = Math.max((ce - cs) * HR_PX, 22);
      const cls = evClass(b);
      const svc = shortSvc(b);
      const who = shortWho(b);
      const tStr = s.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });

      h += `<div class="week-event ${cls}"
        style="top:${top}px;height:${ht}px;"
        data-id="${esc(b.id)}" onclick="showDetail(this.dataset.id)"
        title="${esc(who)} - ${esc(svc)}">
        <div class="ev-svc">${esc(svc)}${b.payment === 'Cash' ? '<span class="ev-cash-badge"> $</span>' : ''}</div>`;
      if (ht > 30) h += `<div class="ev-who">${esc(who)}</div>`;
      if (ht > 46) h += `<div class="ev-t">${tStr}</div>`;
      h += '</div>';
    });

    h += '</div></div>';
  });

  h += '</div>';
  document.getElementById('calendar-area').innerHTML = h;
}

// ─────────────────────────────────────────
//  MONTH VIEW
// ─────────────────────────────────────────
function renderMonth() {
  const yr    = currentDate.getFullYear();
  const mo    = currentDate.getMonth();
  const today = midnight(new Date());
  const DAYS  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  const first = new Date(yr, mo, 1);
  const last  = new Date(yr, mo + 1, 0);

  let offset = first.getDay() - 1;
  if (offset < 0) offset = 6;

  let h = '<div class="month-grid">';
  DAYS.forEach(d => { h += `<div class="mg-head">${d}</div>`; });

  const cells = Math.ceil((offset + last.getDate()) / 7) * 7;
  for (let i = 0; i < cells; i++) {
    const cellDate = new Date(yr, mo, i - offset + 1);
    const thisMo   = cellDate.getMonth() === mo;
    const isToday  = midnight(cellDate).getTime() === today.getTime();
    const bks      = bookingsForDay(cellDate);

    let cls = 'mg-cell';
    if (!thisMo)  cls += ' other-m';
    if (isToday)  cls += ' today-m';

    h += `<div class="${cls}"><span class="mg-num">${cellDate.getDate()}</span>`;
    launchesForDay(cellDate).forEach(l => {
      h += `<div class="launch-chip lc-${l.color}" title="${esc(l.title)}">${esc(l.title)}</div>`;
    });
    bks.forEach(b => {
      const s   = new Date(b.start);
      const ts  = s.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
      const cls2 = evClass(b);
      h += `<div class="month-event ${cls2}"
        data-id="${esc(b.id)}" onclick="showDetail(this.dataset.id)"
        title="${esc(shortWho(b))} - ${esc(shortSvc(b))}">
        ${esc(ts)} ${esc(shortSvc(b))}${b.payment === 'Cash' ? '<span class="ev-cash-badge"> $</span>' : ''} &ndash; ${esc(shortWho(b))}
      </div>`;
    });
    h += '</div>';
  }

  h += '</div>';
  document.getElementById('calendar-area').innerHTML = h;
}

async function submitReschedule(id) {
  const b = allBookings.find(x => x.id === id);
  if (!b) return;

  const dateVal = document.getElementById('rs-date').value;
  const timeVal = document.getElementById('rs-time').value;
  if (!dateVal || !timeVal) {
    alert('Please enter both a date and time.');
    return;
  }

  // Calculate new end time using original duration
  const origStart    = new Date(b.start);
  const origEnd      = new Date(b.end);
  const durationMs   = origEnd - origStart;
  const newStart     = new Date(dateVal + 'T' + timeVal);
  const newEnd       = new Date(newStart.getTime() + durationMs);

  document.getElementById('dp-action-area').innerHTML =
    '<div class="dp-processing">Rescheduling&hellip;</div>';

  try {
    const res  = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body:   JSON.stringify({
        type:        'reschedule',
        eventId:     id,
        newStartISO: newStart.toISOString(),
        newEndISO:   newEnd.toISOString(),
        clientName:  b.clientName,
        email:       b.email,
        service:     shortSvc(b),
        oldStart:    b.start,
        format:      b.format
      })
    });
    const data = await res.json();
    if (data.success) {
      // Update local booking
      const idx = allBookings.findIndex(x => x.id === id);
      if (idx >= 0) {
        allBookings[idx].start = newStart.toISOString();
        allBookings[idx].end   = newEnd.toISOString();
      }
      fetchedKeys.clear();
      closeDetail();
      renderCalendar();
    } else {
      document.getElementById('dp-action-area').innerHTML =
        `<div class="dp-confirm-box">Could not reschedule: ${esc(data.error || 'Unknown error')}</div>`;
    }
  } catch(err) {
    document.getElementById('dp-action-area').innerHTML =
      `<div class="dp-confirm-box">Connection error: ${esc(err.toString())}</div>`;
  }
}

  document.getElementById('dp-action-area').innerHTML = '';
}

// ─────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────
function weekStart(date) {
  const d = midnight(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}

function midnight(d) {
  const n = new Date(d);
  n.setHours(0, 0, 0, 0);
  return n;
}

function bookingsForDay(date) {
  const s = midnight(date);
  const e = new Date(s.getTime() + 86400000 - 1);
  return allBookings
    .filter(b => { const t = new Date(b.start); return t >= s && t <= e; })
    .sort((a, b) => new Date(a.start) - new Date(b.start));
}

function evClass(b) {
  const svc = (b.service || b.title || '').toLowerCase();
  if (svc.includes('massage') || svc.includes('myotherapy'))                               return 'ev-massage';
  if (svc.includes('tarot') || svc.includes('reading') || svc.includes('psychic') || svc.includes('akashic')) return 'ev-reading';
  if (svc.includes('mentoring') || svc.includes('align') || svc.includes('flow') || svc.includes('soul'))     return 'ev-mentoring';
  if (svc.includes('reiki') || svc.includes('healing') || svc.includes('intuitive'))      return 'ev-reiki';
  if (svc.includes('email') || svc.includes('monthly') || svc.includes('newsletter') || svc.includes('launch')) return 'ev-reading';
  if (svc.includes('market')) return 'ev-market';
  return 'ev-phone';
}

function shortSvc(b) {
  if (b.service) return b.service;
  return b.title.replace('EWJ - ', '').replace(/\s*\(.*\)$/, '').trim();
}

function shortWho(b) {
  if (!b.clientName) return '';
  return b.clientName.split(' ')[0];
}

function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function showError(msg) {
  document.getElementById('calendar-area').innerHTML =
    `<div class="error-box"><strong>Could not load bookings.</strong>${esc(msg).replace(/\n/g,'<br>')}</div>`;
}

function getMktTemplates() {

}

  localStorage.setItem('ewj_markets', JSON.stringify(arr));
}
function saveMktTemplate(name, location, start, end) {
  const arr = getMktTemplates();
  if (!arr.find(t => t.name === name)) {
    arr.push({ name, location, start, end });
    saveMktTemplates(arr);

}

  saveMktTemplates(getMktTemplates().filter(t => t.name !== name));

  const end      = document.getElementById('mkt-end').value;
  const location = document.getElementById('mkt-location').value.trim();
  const msg      = document.getElementById('mkt-msg');

  if (!name || !date || !start || !end) {
    msg.style.color = '#c00';
    msg.textContent = 'Please fill in name, date, and times.';
    return;
  }

  msg.style.color = '#555';
  msg.textContent = 'Saving…';

  const params = new URLSearchParams({ action: 'createMarket', name, date, start, end });
  if (location) params.append('location', location);

  try {
    const res  = await fetch(APPS_SCRIPT_URL + '?' + params.toString());
    const data = await res.json();
    if (data.success) {
      saveMktTemplate(name, location, start, end);
      msg.style.color = '#2a7a2a';
      msg.textContent = 'Market added!';
      setTimeout(() => { closeMarketModal(); fetchBookings(); }, 800);
    } else {
      msg.style.color = '#c00';
      msg.textContent = 'Error: ' + (data.error || 'Unknown');
    }
  } catch(err) {
    msg.style.color = '#c00';
    msg.textContent = 'Could not reach Apps Script.';
  }
}
</script>

<!-- MARKET MODAL -->
<div class="market-overlay" id="market-overlay" onclick="if(event.target===this)closeMarketModal()">
  <div class="market-modal">
    <h3>Add Market</h3>
    <div id="mkt-pills" class="mkt-pills-wrap" style="display:none"></div>
    <div class="market-field">
      <label>Market name</label>
      <input type="text" id="mkt-name" placeholder="e.g. Adelaide Farmers Market">
    </div>
    <div class="market-field">
      <label>Date</label>
      <input type="date" id="mkt-date">
    </div>
    <div class="market-row">
      <div class="market-field">
        <label>Start time</label>
        <input type="time" id="mkt-start">
      </div>
      <div class="market-field">
        <label>End time</label>
        <input type="time" id="mkt-end">
      </div>
    </div>
    <div class="market-field">
      <label>Location (optional)</label>
      <input type="text" id="mkt-location" placeholder="e.g. Handorf">
    </div>
    <div class="market-msg" id="mkt-msg"></div>
    <div class="market-actions">
      <button class="btn-cancel-m" onclick="closeMarketModal()">Cancel</button>
      <button class="btn-save" onclick="submitMarket()">Add to calendar</button>
    </div>
  </div>
</div>

</body>
</html>
